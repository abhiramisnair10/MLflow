name: Continuous Integration and Docker Build

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build-and-test:
runs-on: ubuntu-latest

defaults:
  run:
    working-directory: ./MLOps-demo

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: Check Project Folder
    run: |
      pwd
      ls -la
      test -f requirements.txt
      test -f Dockerfile
      test -d tests
      echo "Project folder verified successfully."

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pytest httpx

  - name: Run Tests
    env:
      PYTHONPATH: .
    run: |
      pytest tests/ -v

  - name: Build Docker Image
    run: |
      docker build -t iris-mlops-api:latest .

  - name: Verify Docker Image
    run: |
      docker images
      docker image inspect iris-mlops-api:latest

  - name: Build Completed
    run: |
      echo "All tests passed."
      echo "Docker image built successfully."
