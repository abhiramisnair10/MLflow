name: Continuous Integration and Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check Project Folder
        run: |
          pwd
          ls -la
          ls -la MLOps-demo

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r MLOps-demo/requirements.txt

      - name: Run Tests
        run: |
          python -m pytest MLOps-demo/tests/ -v

      - name: Build Docker Image
        run: |
          docker build -t iris-mlops:latest MLOps-demo/
